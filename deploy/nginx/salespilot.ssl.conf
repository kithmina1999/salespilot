# SalesPilot production Nginx reverse proxy.
# CHANGE_ME: This config assumes Docker Compose publishes:
# - landing:  127.0.0.1:3002
# - app:      127.0.0.1:3000
# - admin:    127.0.0.1:3001
# - api:      127.0.0.1:8080
# If docker-compose.prod.yml ports change, update the upstreams below.
#
# CHANGE_ME: This config assumes Certbot creates:
# /etc/letsencrypt/live/salespilot.lk/fullchain.pem
# /etc/letsencrypt/live/salespilot.lk/privkey.pem
# If Certbot creates salespilot.lk-0001 or another name, update ssl_certificate
# and ssl_certificate_key in all SSL server blocks.
#
# Install deploy/nginx/salespilot-ssl-params.conf to:
# /etc/nginx/snippets/salespilot-ssl-params.conf
# Install deploy/nginx/salespilot-security-headers.conf to:
# /etc/nginx/snippets/salespilot-security-headers.conf
# Install deploy/nginx/salespilot-api-proxy.conf to:
# /etc/nginx/snippets/salespilot-api-proxy.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

limit_req_zone $binary_remote_addr zone=salespilot_api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=salespilot_api_upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=salespilot_api_webhook:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=salespilot_api_general:20m rate=120r/m;
limit_req_status 429;

upstream salespilot_landing {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream salespilot_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream salespilot_admin {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream salespilot_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name salespilot.lk www.salespilot.lk app.salespilot.lk admin.salespilot.lk api.salespilot.lk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name salespilot.lk;

    ssl_certificate /etc/letsencrypt/live/salespilot.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salespilot.lk/privkey.pem;
    include /etc/nginx/snippets/salespilot-ssl-params.conf;
    include /etc/nginx/snippets/salespilot-security-headers.conf;

    client_max_body_size 20m;

    location / {
        proxy_pass http://salespilot_landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.salespilot.lk;

    ssl_certificate /etc/letsencrypt/live/salespilot.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salespilot.lk/privkey.pem;
    include /etc/nginx/snippets/salespilot-ssl-params.conf;
    include /etc/nginx/snippets/salespilot-security-headers.conf;

    return 301 https://salespilot.lk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name app.salespilot.lk;

    ssl_certificate /etc/letsencrypt/live/salespilot.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salespilot.lk/privkey.pem;
    include /etc/nginx/snippets/salespilot-ssl-params.conf;
    include /etc/nginx/snippets/salespilot-security-headers.conf;

    client_max_body_size 20m;

    location / {
        proxy_pass http://salespilot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name admin.salespilot.lk;

    ssl_certificate /etc/letsencrypt/live/salespilot.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salespilot.lk/privkey.pem;
    include /etc/nginx/snippets/salespilot-ssl-params.conf;
    include /etc/nginx/snippets/salespilot-security-headers.conf;

    client_max_body_size 20m;

    location / {
        proxy_pass http://salespilot_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name api.salespilot.lk;

    ssl_certificate /etc/letsencrypt/live/salespilot.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salespilot.lk/privkey.pem;
    include /etc/nginx/snippets/salespilot-ssl-params.conf;
    include /etc/nginx/snippets/salespilot-security-headers.conf;

    client_max_body_size 20m;

    location ^~ /api/v1/auth/ {
        limit_req zone=salespilot_api_auth burst=20 nodelay;
        include /etc/nginx/snippets/salespilot-api-proxy.conf;
    }

    location = /api/v1/billing/submit-proof {
        limit_req zone=salespilot_api_upload burst=10 nodelay;
        include /etc/nginx/snippets/salespilot-api-proxy.conf;
    }

    location = /api/whatsapp/webhook {
        limit_req zone=salespilot_api_webhook burst=120 nodelay;
        include /etc/nginx/snippets/salespilot-api-proxy.conf;
    }

    location / {
        limit_req zone=salespilot_api_general burst=240 nodelay;
        include /etc/nginx/snippets/salespilot-api-proxy.conf;
    }
}
