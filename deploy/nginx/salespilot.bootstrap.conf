# SalesPilot Nginx bootstrap config for first Let's Encrypt issuance.
# CHANGE_ME: If domains change, update every server_name here and in
# deploy/nginx/salespilot.ssl.conf.
#
# Install this first, reload nginx, issue the certificate with certbot webroot,
# then replace it with salespilot.ssl.conf.

server {
    listen 80;
    listen [::]:80;

    server_name salespilot.lk www.salespilot.lk app.salespilot.lk admin.salespilot.lk api.salespilot.lk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        default_type "text/plain";
        return 200 "SalesPilot Nginx bootstrap is ready. Issue the Let's Encrypt certificate, then install the SSL config.\n";
    }
}
