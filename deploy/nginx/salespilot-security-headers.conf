# Baseline browser security headers for SalesPilot HTTPS responses.
# CSP is enforced here. Next.js currently needs unsafe-inline/unsafe-eval; move
# to nonce/hash-based script/style directives in a later hardening pass.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://sandbox.payhere.lk https://www.payhere.lk; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.cloudinary.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.salespilot.lk https://*.sentry.io https://*.ingest.sentry.io https://*.ingest.us.sentry.io; media-src 'self' blob: data: https://res.cloudinary.com https://*.cloudinary.com; frame-src 'self' https://sandbox.payhere.lk https://www.payhere.lk; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-XSS-Protection "0" always;
